services:

  postgres:
    image: postgres:17
    container_name: vietnam-logistics-postgres
    environment:
      POSTGRES_DB: vietnam_logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.1.0
    container_name: vietnam-logistics-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: LOCAL://:9092,CI://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: LOCAL://localhost:9092,CI://host.docker.internal:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: LOCAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT,CI:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: vietnam-logistics-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: vietnam-logistics-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

      # Do not send usage telemetry to Elastic
      TELEMETRY_OPTIN: "false"

      # Don't allow it to be re-enabled from Kibana UI
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"

      # Tell Fleet that this environment has no Internet services
      XPACK_FLEET_ISAIRGAPPED: "true"
    depends_on:
      - elasticsearch

volumes:
  elasticsearch-data: